name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Validate release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Match tag and version.properties
        id: version
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re

          values = {}
          for line in pathlib.Path("version.properties").read_text(encoding="utf-8").splitlines():
              if line and not line.lstrip().startswith("#"):
                  key, separator, value = line.partition("=")
                  if separator:
                      values[key.strip()] = value.strip()

          version = values.get("versionName", "")
          version_code = values.get("versionCode", "")
          tag = os.environ["GITHUB_REF_NAME"]
          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              raise SystemExit("versionName must use x.y.z format")
          if not version_code.isdigit() or int(version_code) < 1:
              raise SystemExit("versionCode must be a positive integer")
          if tag != f"v{version}":
              raise SystemExit(f"Tag {tag!r} does not match versionName {version!r}")

          output = pathlib.Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as stream:
              stream.write(f"version={version}\n")
              stream.write(f"version_code={version_code}\n")
          PY

  android:
    name: Signed Android APK
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mobileCallReceive
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            sdkmanager="$(find "$sdk_root/cmdline-tools" -path '*/bin/sdkmanager' -type f -print -quit 2>/dev/null || true)"
          fi
          [[ -n "$sdkmanager" && -x "$sdkmanager" ]] || {
            echo "Android sdkmanager was not found under $sdk_root" >&2
            exit 1
          }
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          "$sdkmanager" "platforms;android-37" "build-tools;36.0.0"

      - name: Restore release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=()
          [[ -n "$KEYSTORE_BASE64" ]] || missing+=(ANDROID_KEYSTORE_BASE64)
          [[ -n "$KEYSTORE_PASSWORD" ]] || missing+=(ANDROID_KEYSTORE_PASSWORD)
          [[ -n "$KEY_ALIAS" ]] || missing+=(ANDROID_KEY_ALIAS)
          [[ -n "$KEY_PASSWORD" ]] || missing+=(ANDROID_KEY_PASSWORD)
          if (( ${#missing[@]} > 0 )); then
            echo "Missing required Android signing secrets: ${missing[*]}" >&2
            exit 1
          fi
          keystore="$RUNNER_TEMP/mobileCallReceive-release.jks"
          if ! printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"; then
            echo "ANDROID_KEYSTORE_BASE64 is not valid Base64." >&2
            rm -f "$keystore"
            exit 1
          fi
          [[ -s "$keystore" ]] || { echo "Decoded keystore is empty." >&2; exit 1; }
          echo "ANDROID_KEYSTORE_FILE=$keystore" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Test, lint, and build signed release APK
        shell: bash
        run: bash ./gradlew --no-daemon --no-configuration-cache :app:testDebugUnitTest :app:lintDebug :app:assembleRelease

      - name: Verify APK signature and manifest
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.metadata.outputs.version }}
          EXPECTED_VERSION_CODE: ${{ needs.metadata.outputs.version_code }}
        run: |
          apk="app/build/outputs/apk/release/app-release.apk"
          test -f "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
          badging="$($ANDROID_HOME/build-tools/36.0.0/aapt dump badging "$apk" | head -n 1)"
          echo "$badging"
          [[ "$badging" == *"name='net.onebell.mcs'"* ]]
          [[ "$badging" == *"versionCode='$EXPECTED_VERSION_CODE'"* ]]
          [[ "$badging" == *"versionName='$EXPECTED_VERSION'"* ]]

      - name: Prepare APK asset
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/release-android"
          cp app/build/outputs/apk/release/app-release.apk \
            "$RUNNER_TEMP/release-android/mobileCallReceive-${GITHUB_REF_NAME}.apk"

      - name: Upload Android artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: android-release
          path: ${{ runner.temp }}/release-android/*.apk
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows self-contained ZIP
    needs: metadata
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x

      - name: Build and run non-desktop tests
        shell: pwsh
        run: |
          dotnet build CallReceiver/CallReceiver.slnx --configuration Release
          dotnet test CallReceiver/CallReceiver.slnx --configuration Release --no-build --filter "Category!=Desktop"

      - name: Publish win-x64
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          $publishDirectory = Join-Path $env:RUNNER_TEMP "CallReceiver-win-x64-$env:GITHUB_REF_NAME"
          $assetDirectory = Join-Path $env:RUNNER_TEMP "release-windows"
          New-Item -ItemType Directory -Force -Path $assetDirectory | Out-Null
          dotnet publish CallReceiver/CallReceiver/CallReceiver.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output $publishDirectory `
            -p:PublishSingleFile=false `
            -p:PublishTrimmed=false
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed" }
          $exe = Join-Path $publishDirectory "CallReceiver.exe"
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw "CallReceiver.exe was not published" }
          $productVersion = [Diagnostics.FileVersionInfo]::GetVersionInfo($exe).ProductVersion
          if ($productVersion -ne $env:RELEASE_VERSION) {
            throw "Unexpected product version: $productVersion"
          }
          $forbidden = Get-ChildItem -LiteralPath $publishDirectory -Recurse -File | Where-Object {
            $_.Name -in @('settings.json', 'config-location.json', 'events.sqlite3') -or
            $_.Extension -in @('.jks', '.keystore', '.pfx', '.p12', '.trx')
          }
          if ($forbidden) { throw "Forbidden runtime/user files found: $($forbidden.FullName -join ', ')" }
          $zip = Join-Path $assetDirectory "CallReceiver-win-x64-$env:GITHUB_REF_NAME.zip"
          Compress-Archive -Path (Join-Path $publishDirectory '*') -DestinationPath $zip -CompressionLevel Optimal

      - name: Upload Windows artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: windows-release
          path: ${{ runner.temp }}/release-windows/*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [metadata, android, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Download build artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify files and create checksums
        shell: bash
        run: |
          cd release-assets
          expected_apk="mobileCallReceive-${GITHUB_REF_NAME}.apk"
          expected_zip="CallReceiver-win-x64-${GITHUB_REF_NAME}.zip"
          test -s "$expected_apk"
          test -s "$expected_zip"
          mapfile -t unexpected < <(find . -maxdepth 1 -type f ! -name "$expected_apk" ! -name "$expected_zip" -printf '%f\n')
          if (( ${#unexpected[@]} > 0 )); then
            printf 'Unexpected release files: %s\n' "${unexpected[*]}" >&2
            exit 1
          fi
          sha256sum "$expected_apk" "$expected_zip" > SHA256SUMS.txt
          test "$(wc -l < SHA256SUMS.txt)" -eq 2
          sha256sum --check SHA256SUMS.txt

      - name: Create draft, verify assets, and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            is_draft="$(gh release view "$tag" --json isDraft --jq .isDraft)"
            if [[ "$is_draft" != "true" ]]; then
              echo "Release $tag is already published; refusing to overwrite it." >&2
              exit 1
            fi
            gh release delete "$tag" --yes
          fi

          gh release create "$tag" \
            release-assets/mobileCallReceive-${tag}.apk \
            release-assets/CallReceiver-win-x64-${tag}.zip \
            release-assets/SHA256SUMS.txt \
            --draft \
            --verify-tag \
            --generate-notes \
            --title "$tag"

          mapfile -t actual < <(gh release view "$tag" --json assets --jq '.assets[].name' | sort)
          mapfile -t expected < <(printf '%s\n' \
            "CallReceiver-win-x64-${tag}.zip" \
            "SHA256SUMS.txt" \
            "mobileCallReceive-${tag}.apk" | sort)
          if [[ "${actual[*]}" != "${expected[*]}" ]]; then
            echo "Release asset verification failed." >&2
            printf 'Expected: %s\nActual: %s\n' "${expected[*]}" "${actual[*]}" >&2
            exit 1
          fi
          gh release edit "$tag" --draft=false --latest
